# Supabase 本地化部署配置
# 官方文档: https://supabase.com/docs/guides/self-hosting/docker

version: "3.8"

services:
  # ============ PostgreSQL 数据库 ============
  db:
    image: supabase/postgres:15.1.0.117
    container_name: supabase-db
    healthcheck:
      test: pg_isready -U postgres -h localhost
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD:-your-super-secret-password}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-your-super-secret-password}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./volumes/db/data:/var/lib/postgresql/data
      # 首次初始化只执行引导脚本（基础结构 + 角色密码）；
      # 增量迁移由 migrations 服务在 auth 就绪后应用。
      - ./initdb:/docker-entrypoint-initdb.d:ro
      - ./migrations:/migrations:ro
    restart: unless-stopped
    networks:
      - supabase-network

  # ============ 迁移执行器（增量迁移自动化） ============
  migrations:
    image: postgres:15-alpine
    container_name: supabase-migrations
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-your-super-secret-password}
      MIGRATIONS_DIR: /migrations
      AUTH_WAIT_SECONDS: 300
    volumes:
      - ./migrations:/migrations
    entrypoint: ["sh", "/migrations/run_migrations.sh"]
    restart: "no"
    networks:
      - supabase-network

  # ============ Supabase Auth (GoTrue) ============
  auth:
    image: supabase/gotrue:v2.143.0
    container_name: supabase-auth
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:-http://localhost:8000}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD:-your-super-secret-password}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL:-http://localhost:3000}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP:-true}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-true}
    ports:
      - "9999:9999"
    restart: unless-stopped
    networks:
      - supabase-network

  # ============ PostgREST (REST API) ============
  rest:
    image: postgrest/postgrest:v11.2.2
    container_name: supabase-rest
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD:-your-super-secret-password}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-super-secret-jwt-token-with-at-least-32-characters-long}
      PGRST_DB_USE_LEGACY_GUCS: "true"
    ports:
      - "3002:3000"  # 改为 3002 避免与前端 Vite (3000) 端口冲突
    restart: unless-stopped
    networks:
      - supabase-network

networks:
  supabase-network:
    driver: bridge
