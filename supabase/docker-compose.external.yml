# NeoFlow self-hosted profile:
# - PostgreSQL is an existing server/database, not a Compose-managed db.
# - Keep only Auth, PostgREST, migrations, Studio and postgres-meta.
# - Storage, Realtime, Edge Functions, imgproxy and analytics stay disabled.

services:
  api:
    env_file:
      - ../.env.local
    environment:
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWKS_URL: ${JWKS_URL:-}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}

  api-worker:
    env_file:
      - ../.env.local
    environment:
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWKS_URL: ${JWKS_URL:-}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}

  auth:
    image: supabase/gotrue:v2.143.0
    container_name: supabase-auth
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 12
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY:-3600}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP:-true}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-true}
    ports:
      - "127.0.0.1:${AUTH_PORT:-9999}:9999"
    restart: unless-stopped
    networks: [supabase-network]

  rest:
    image: postgrest/postgrest:v11.2.2
    container_name: supabase-rest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "true"
    ports:
      - "127.0.0.1:${REST_PORT:-3002}:3000"
    restart: unless-stopped
    networks: [supabase-network]

  migrations:
    image: postgres:15-alpine
    container_name: supabase-migrations
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      auth:
        condition: service_started
    environment:
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      MIGRATIONS_DIR: /migrations
      AUTH_WAIT_SECONDS: 300
      MIGRATION_SKIP_FILES: 004_seed_users.sql
    volumes:
      - ./migrations:/migrations:ro
    entrypoint: ["sh", "/migrations/run_migrations.sh"]
    restart: "no"
    networks: [supabase-network]

  meta:
    image: supabase/postgres-meta:v0.99.0
    container_name: supabase-meta
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: ${POSTGRES_HOST}
      PG_META_DB_PORT: ${POSTGRES_PORT}
      PG_META_DB_NAME: ${POSTGRES_DB}
      PG_META_DB_USER: ${POSTGRES_USER}
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
    restart: unless-stopped
    networks: [supabase-network]

  studio:
    image: supabase/studio:2026.04.27-sha-5f60601
    container_name: supabase-studio
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      meta:
        condition: service_started
    environment:
      HOSTNAME: 0.0.0.0
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: ${POSTGRES_USER}
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public
      DEFAULT_ORGANIZATION_NAME: ${STUDIO_DEFAULT_ORGANIZATION:-NeoFlow}
      DEFAULT_PROJECT_NAME: ${STUDIO_DEFAULT_PROJECT:-NeoFlow}
      SUPABASE_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_PUBLIC_URL: ${SUPABASE_PUBLIC_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
    ports:
      - "127.0.0.1:${STUDIO_PORT:-3001}:3000"
    restart: unless-stopped
    networks: [supabase-network]

networks:
  supabase-network:
    name: neoflow-supabase-network
