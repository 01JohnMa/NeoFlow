name: Validate inline Extract editor
on:
  push:
    branches: [codex/extract-schema-builder-delivery]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: test-anon-key
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          path: delivery
      - uses: actions/checkout@v4.4.0
        with:
          ref: e001849eddaa7cc0b27e23dd4d84381d7090838d
          path: source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply verified frontend-only changes
        id: apply
        working-directory: source
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, os, pathlib, tarfile
          root = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          data = base64.b64decode(''.join((root/'delivery'/'.inline-delivery'/f'part{i}').read_text() for i in range(3)), validate=True)
          assert hashlib.sha256(data).hexdigest() == 'f151377cbf743f6b38808e228fae8703b0bbba0ec491a9ed980f24164842120e'
          original = {
            'web/src/components/extract/ExtractSchemaEditor.tsx': 'c31cb83ef79458e105a907c505c1f806cffa02ba',
            'web/src/lib/extractSchema.ts': '956de657d8bc3d028710bb3a84bd71b43ffea367',
            'web/src/pages/AdminFieldsTab.tsx': '666c2cb08849858ac8f9008afbb267f6aadcb57b',
          }
          paths = []
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:xz') as bundle:
            for member in bundle.getmembers():
              name = pathlib.PurePosixPath(member.name)
              assert member.isfile() and not name.is_absolute() and '..' not in name.parts
              assert member.name.startswith(('web/', 'docs/')) and member.name not in paths
              destination = root/'source'/member.name
              if member.name in original:
                old = destination.read_bytes()
                assert hashlib.sha1(b'blob '+str(len(old)).encode()+b'\0'+old).hexdigest() == original[member.name]
              else:
                assert not destination.exists(), member.name
              contents = bundle.extractfile(member).read()
              contents.decode('utf-8')
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(contents)
              paths.append(member.name)
          assert len(paths) == 9
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'inline-paths.json').write_text(json.dumps(paths))
          print('\n'.join(paths))
          PY
          python "$GITHUB_WORKSPACE/delivery/.inline-delivery/fixups.py"
          git diff --check
      - name: Install frontend dependencies
        id: deps
        working-directory: source/web
        run: npm ci
      - name: Frontend regression
        id: tests
        continue-on-error: true
        working-directory: source/web
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/inline-tests.log"
      - name: TypeScript and production build
        id: build
        if: always() && steps.deps.outcome == 'success'
        continue-on-error: true
        working-directory: source/web
        run: |
          set -o pipefail
          npm run build 2>&1 | tee "$RUNNER_TEMP/inline-build.log"
      - name: Chromium interaction regression
        id: browser
        if: always() && steps.deps.outcome == 'success'
        continue-on-error: true
        working-directory: source/web
        run: |
          set -o pipefail
          npm install --prefix "$RUNNER_TEMP/inline-browser" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/inline-browser/node_modules/.bin/playwright" install --with-deps chromium
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/inline-browser/node_modules/playwright"
          npm run dev -- --host 127.0.0.1 --port 4173 > "$RUNNER_TEMP/inline-vite.log" 2>&1 &
          vite_pid=$!
          trap 'kill "$vite_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:4173/e2e/extract-editor.html >/dev/null && break; sleep 1; done
          node e2e/extract-editor.cjs 2>&1 | tee "$RUNNER_TEMP/inline-browser.log"
      - name: Show browser failure context
        if: always() && steps.browser.outcome == 'failure'
        run: |
          cat "$RUNNER_TEMP/inline-vite.log" || true
          tail -c 20000 /tmp/extract-editor-browser/failure.html || true
      - name: Store browser failure artifacts
        if: always() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: extract-inline-browser-failure
          path: /tmp/extract-editor-browser/
          if-no-files-found: ignore
      - name: Record candidate only; never update neoflow2.0 here
        id: candidate
        if: always() && steps.apply.outcome == 'success'
        working-directory: source
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
        run: |
          python - <<'PY'
          import json, os, pathlib, re, subprocess
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          paths = json.loads((temp/'inline-paths.json').read_text())
          report = pathlib.Path('docs/extract-inline-editor-validation.md')
          text = '# Inline Extract editor validation\n\nBase: `e001849eddaa7cc0b27e23dd4d84381d7090838d`.\n\n'
          for label, env in [('Vitest','TEST_OUTCOME'),('TypeScript and production build','BUILD_OUTCOME'),('Chromium interactions','BROWSER_OUTCOME')]:
            text += f'- {label}: **{os.environ[env]}**\n'
          text += f"\nRun: {os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}\n"
          for name in ['inline-tests.log', 'inline-browser.log']:
            file = temp/name
            if file.exists():
              clean = re.sub(r'\x1b\[[0-9;]*m', '', file.read_text())
              lines = [line for line in clean.splitlines() if 'passed' in line or line.startswith(('PASS ', 'FAIL:'))]
              text += '\n```text\n'+'\n'.join(lines)+'\n```\n'
          text += '\nOnly frontend code, isolated browser fixtures and documentation changed. No backend, execution semantics, legacy migration, seed writes or deployment. Browser API requests are mocked; no real database/model integration was performed. Browser tooling is installed separately from the locked application dependencies. No package versions or lockfiles were changed.\n'
          report.write_text(text)
          subprocess.check_call(['git','add','--',*paths,str(report)])
          PY
          git diff --cached --check
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(extract): inline tree schema editing with sticky save and contextual field actions'
          candidate="codex/extract-inline-editor-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push origin "HEAD:refs/heads/$candidate"
          echo "Candidate: $candidate" >> "$GITHUB_STEP_SUMMARY"
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
      - name: Validation gate
        if: always()
        run: |
          test '${{ steps.apply.outcome }}' = success
          test '${{ steps.tests.outcome }}' = success
          test '${{ steps.build.outcome }}' = success
          test '${{ steps.browser.outcome }}' = success
          test '${{ steps.candidate.outcome }}' = success
