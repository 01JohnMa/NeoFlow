version: "3.8"

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile.api
    container_name: neoflow-api
    env_file:
      - ../.env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      SUPABASE_URL: http://rest:3000
      # 与 supabase/.env 一致：用 ANON_KEY、SERVICE_ROLE_KEY，后端读 SUPABASE_* 即可
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      UPLOAD_FOLDER: /app/uploads
      LOG_FILE: /app/logs/app.log
    volumes:
      - ../uploads:/app/uploads
      - ../logs:/app/logs
    depends_on:
      - rest
    expose:
      - "8080"
    restart: unless-stopped
    networks:
      - supabase-network

  api-worker:
    build:
      context: ..
      dockerfile: Dockerfile.api
    container_name: neoflow-api-worker
    env_file:
      - ../.env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      SUPABASE_URL: http://rest:3000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      UPLOAD_FOLDER: /app/uploads
      LOG_FILE: /app/logs/worker.log
    command: ["python", "-m", "workers.document_worker"]
    volumes:
      - ../uploads:/app/uploads
      - ../logs:/app/logs
    depends_on:
      - rest
    restart: unless-stopped
    networks:
      - supabase-network

  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SUPABASE_URL: /supabase
        VITE_SUPABASE_ANON_KEY: ${ANON_KEY}
    container_name: neoflow-web
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - supabase-network

  ingress:
    image: nginx:1.25-alpine
    container_name: neoflow-ingress
    volumes:
      - ../deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
      - auth
      - rest
    ports:
      - "${INGRESS_HTTP_PORT:-8080}:80"
    restart: unless-stopped
    networks:
      - supabase-network

networks:
  supabase-network:
    driver: bridge
