# Minimal AI Center publication contract for NeoFlow.
runtime:
  kind: python-http
  command: [uvicorn, api.main:app, --host, 0.0.0.0, --port, "8080"]
  port: 8080
  healthcheck_path: /api/health
environment:
  - name: SUPABASE_URL
    required: true
    sensitive: false
  - name: SUPABASE_ANON_KEY
    required: true
    sensitive: true
  - name: SUPABASE_SERVICE_ROLE_KEY
    required: true
    sensitive: true
  - name: JWT_SECRET
    required: false
    sensitive: true
  - name: JWKS_URL
    required: false
    sensitive: false
  - name: MINERU_API_KEY
    required: true
    sensitive: true
  - name: MINERU_BASE_URL
    required: true
    sensitive: false
  - name: DOC_WORKER_ID
    required: true
    sensitive: false
  - name: DOC_PROCESS_MAX_CONCURRENCY
    required: false
    sensitive: false
  - name: DOC_WORKER_POLL_INTERVAL_SECONDS
    required: false
    sensitive: false
  - name: DOC_WORKER_STALE_LOCK_SECONDS
    required: false
    sensitive: false
  - name: LLM_MODEL_ID
    required: false
    sensitive: false
  - name: SDK_MODEL_ID
    required: false
    sensitive: false
worker:
  command: [python, -m, workers.document_worker]

# 平台注入说明（不在本合同内声明）：
# AI Center 部署进程按版本 runtime_request.model_access 注入
#   AI_CENTER_MODEL_GATEWAY_URL_TEMPLATE / AI_CENTER_RUNTIME_CREDENTIAL / AI_CENTER_MODEL_OPERATIONS
# 三元组（relay 模式）；不注入 LITELLM_BASE_URL / LITELLM_API_KEY。
# 这些名称属于平台保留名，应用 manifest 不得声明或覆盖。

# 平台模型访问声明（2026-09-29 起）：模型调用统一经 AI Center Relay，
# 平台按此注入 Relay 三元组并授予异步访问窗口；不再注入 LITELLM_*。
model_access:
  mode: relay
  operations:
    - chat.completions
    - embeddings
  async_job_timeout_seconds: 900
